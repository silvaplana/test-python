server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sert l'application React. "try_files" fait retomber toute route
    # inconnue (ex: /some/route) sur index.html : c'est nécessaire pour
    # une SPA (Single Page Application) dont le routage est géré côté
    # client (même si ce projet n'a qu'une seule page pour l'instant).
    location / {
        try_files $uri /index.html;
    }

    # Proxy : les requêtes /api/... sont redirigées vers le conteneur
    # "backend" (nom du service dans docker-compose.yml), en retirant
    # le préfixe /api. Exemple : /api/motor -> http://backend:8000/motor
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
