<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/club-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>samboAdmin</title>

    <!-- PWA "light" : installable avec icone sur Android/iOS (voir
         main.jsx pour l'enregistrement du service worker). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#16171d" />

    <!-- iOS ne lit pas le manifest pour l'icone/le mode "standalone" :
         balises Apple dediees, seule facon d'obtenir une icone correcte
         et une barre d'adresse masquee via "Ajouter a l'ecran d'accueil"
         (Safari, pas de vraie invite d'installation comme sur Android). -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="samboAdmin" />
    <!-- Equivalent standard (hors Apple) de la balise ci-dessus, requis par
         les navigateurs recents (Chrome/Edge) qui deprecient la version
         Apple pour eux -- garder les 2, chaque navigateur ne lit que la
         sienne. -->
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
