# docker-compose décrit et démarre plusieurs conteneurs ensemble,
# ainsi que le réseau qui leur permet de communiquer entre eux.
#
# Commandes utiles :
#   docker compose up -d --build   -> build les images et démarre les conteneurs (arrière-plan)
#   docker compose logs -f         -> suit les logs en direct
#   docker compose ps              -> liste les conteneurs et leur état
#   docker compose down            -> arrête et supprime les conteneurs

services:
  backend:
    build: ./backend
    restart: unless-stopped
    # "expose" (contrairement à "ports") ne rend PAS le port accessible
    # depuis l'extérieur de la machine : seul le conteneur "frontend"
    # peut y accéder, via le réseau interne que docker-compose crée
    # automatiquement pour ce projet.
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    environment:
      # Nom de domaine pour lequel Caddy obtient le certificat HTTPS.
      # Redéfinissable via une variable d'environnement shell, ex. pour
      # tester en local : `DOMAIN=localhost docker compose up -d --build`
      # (Caddy reconnaît "localhost" et génère alors un certificat local
      # auto-signé au lieu d'appeler Let's Encrypt).
      DOMAIN: ${DOMAIN:-silvaplana.cloud}
      # Email utilisé par Let's Encrypt pour les notifications importantes
      # (expiration, changement de conditions) — pas indispensable mais recommandé.
      ACME_EMAIL: ${ACME_EMAIL:-sebastien.richard54@gmail.com}
    # Seuls ces ports sont publiés vers l'extérieur : 80 (redirection auto
    # vers 443 par Caddy + défi ACME Let's Encrypt) et 443 (HTTPS). Caddy
    # sert le front et fait office de reverse proxy vers le backend en interne.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Persiste les certificats obtenus entre deux redémarrages/rebuilds
      # du conteneur : évite de redemander un certificat à chaque déploiement
      # (Let's Encrypt limite le nombre de demandes par domaine/semaine).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
