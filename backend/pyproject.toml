[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samboadmin-backend"
version = "0.1.0"
description = "API REST FastAPI (HelloAsso, FFST, bilan financier) pour samboAdmin"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "python-dotenv",
    "python-multipart",
    "anthropic",
    "playwright",
    "openpyxl",
    "pywebpush",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
app = "app.main:main"
helloasso = "helloasso.helloasso:main"
generate-vapid-keys = "notifications.generate_vapid_keys:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Fichier xlsx source de members_history (voir sa docstring de module) :
# sans ca, "pip install ." (utilise par le Dockerfile) n'embarquerait que
# les .py, pas ce fichier de donnees.
members_history = ["data/*.xlsx"]
