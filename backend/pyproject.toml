[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motor"
version = "0.1.0"
description = "API REST FastAPI exposant MotorModel via MotorReceiver"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
motor = "motor.main:main"

[tool.setuptools.packages.find]
where = ["src"]
