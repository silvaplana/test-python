[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samboadmin-backend"
version = "0.1.0"
description = "API REST FastAPI (HelloAsso, FFST, bilan financier) pour samboAdmin"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "python-dotenv",
    "python-multipart",
    "anthropic",
    "playwright",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
app = "app.main:main"
helloasso = "helloasso.helloasso:main"

[tool.setuptools.packages.find]
where = ["src"]
